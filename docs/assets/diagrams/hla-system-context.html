<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLA System Context and Boundary</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--rule:rgba(45,49,66,.12);--accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--link:#2e5aa8;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Noto Serif KR','Noto Serif TC',serif;--mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}.frame{max-width:1240px;width:100%}.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;line-height:1.15;color:var(--ink);margin-bottom:1.5rem}svg{width:100%;min-width:900px;display:block}.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}.sub{font-family:var(--mono);font-size:8px;fill:var(--muted)}.tag{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:.14em;fill:var(--muted);text-transform:uppercase}.label{font-family:var(--mono);font-size:8px;letter-spacing:.06em;fill:var(--soft)}.legend{font-family:var(--mono);font-size:8px;letter-spacing:.12em;fill:var(--muted)}
</style>
</head>
<body>

<rect x="92" y="176" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="92" y="176" width="240" height="64" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <rect x="100" y="184" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.30)" stroke-opacity=".45" stroke-width=".8"/><text x="120" y="193" class="tag" text-anchor="middle">TOOL</text>
      <text x="212" y="212" class="node-name" text-anchor="middle">Authoring Tools</text>
      <text x="212" y="226" class="sub" text-anchor="middle">construct · validate · import</text>
<rect x="92" y="248" width="240" height="64" rx="6" fill="#f5f5f5"/>

<rect x="760" y="124" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="124" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="132" width="40" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity=".45" stroke-width=".8"/><text x="788" y="141" class="tag" text-anchor="middle">OUT</text>
      <text x="872" y="160" class="node-name" text-anchor="middle">Presentation Model / Diagnostic</text>

<rect x="760" y="248" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="248" width="224" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="256" width="40" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/><text x="788" y="265" class="tag" text-anchor="middle">GATE</text>
      <text x="872" y="284" class="node-name" text-anchor="middle">HLA-VALIDATE</text>
      <text x="872" y="298" class="sub" text-anchor="middle">untrusted content gate</text>
      <line x1="40" y1="368" x2="1040" y2="368" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <text x="40" y="392" class="legend">TRUST BOUNDARY · no cloud, multiplayer, or AI external system is in Architecture scope</text>
    </svg>
  </div>
</body>
</html>
